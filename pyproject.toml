[project]
name = "datacenter-agent"
version = "0.1.0"
description = "Homelab debug & remediate agent: diagnoses LXC disk exhaustion via Grafana, restarts behind a human approval gate"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.12",
    "langchain-core==1.6.5",
    "langchain-openai==1.6.6",
    "langchain-mcp-adapters==0.3.2",
    "proxmoxer==2.3.0",
    "requests==2.34.2",
    "pydantic-settings==2.15.0",
    "python-dotenv>=1.0",
    "mlflow==3.16.1",
    "chainlit==2.12.0",
    "langchain-ollama==1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "evals"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, pyupgrade, bugbear. Broad `except Exception` in tools is
# deliberate (tool errors are returned to the model), so BLE isn't enabled.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
